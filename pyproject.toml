[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "salestools"
version = "1.0.0"
description = "Sales time-series analysis library for the salestools-analyst fine-tuned model"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
jupyter = ["ipython>=8.0"]
dev = ["pytest>=7.4", "pytest-cov", "ipython>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["salestools*", "jupyter_magic*"]
